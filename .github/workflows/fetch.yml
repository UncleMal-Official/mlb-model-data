name: Daily MLB Data Fetch

on:
  schedule:
    # All times UTC. Central Time is UTC-5 in season.
    - cron: "10 13 * * *"   # 8:10 AM CT - morning: fresh statcast, early board
    - cron: "0 20 * * *"    # 3:00 PM CT - afternoon: lineups posting, board filling out
    - cron: "40 22 * * *"   # 5:40 PM CT - pre-lock: final lineups + current PP board
  workflow_dispatch: {}   # lets you run it manually with the "Run workflow" button

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore statcast raw cache
        uses: actions/cache@v4
        with:
          path: raw_cache
          key: statcast-raw-2026-${{ github.run_id }}
          restore-keys: |
            statcast-raw-2026-

      - name: Fetch and aggregate
        run: python fetch.py

      - name: Commit updated data
        run: |
          git config user.name "mlb-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
